schema: tdd-artifact/v1
feature: installation-repo-listing-cache
title: Installation repo listing survives the shared ETag slot
source:
  prd: docs/prd/installation-repo-listing-cache.md
  prd_sha256: 367c7231d569f127cd36816840ad02d9d15ba5c955be2c3b3f8f09a0df7fb09d
defaults:
  priority: P2

non_goals:
  - 'No guard for an owner listing that drops from N repos to 0 for other reasons; no new last-known fallback or warning (PRD section 4, DL-001).'
  - 'No scanning of repos with in-progress runs that the listing or the pushed-within window drops; the cron-only-repo gap is separate (PRD section 4, DL-001).'
  - 'No change to OWNER_REPOS_CACHE_TTL_MS, selectActiveRepos, or the UI (PRD section 7).'
  - 'No new telemetry (PRD section 9, A-002).'
  - 'No claims about /api/queue depth (PRD section 2).'

open_questions: []

requirements:
  - id: REQ-installation-scoped-key
    text: >-
      Every conditional-request cache entry is keyed by the requesting installationKey plus the
      URL, so a 200 stored for one installation never replaces or serves another installation's
      entry for the same URL.
    priority: P0
    type: functional
    prd_ref: 'section 5 story 1; DL-002'
    scenarios:
      - id: SC-key-separate-slots
        level: integration
        title: two installations listing the same URL keep separate cache entries
        given: App auth with installations cigan1 and ryabinski-labs, each owning different repos
        when: fetchOwnerRepos lists cigan1 and then ryabinski-labs
        then: etagCache holds one /installation/repositories entry per installation, each with its own body
        oracle: 'etagCache.get("cigan1 " + url).body lists only cigan1 repos and etagCache.get("ryabinski-labs " + url).body lists only ryabinski-labs repos'
        status: green
        test_ref: "test/etag-installation-scope.test.js::SC-key-separate-slots: two installations listing the same URL keep separate cache entries"
        doubles: 'globalThis.fetch stubbed as GitHub (installations, token mint, listing); server cache code is real'
        data:
          url: 'https://api.github.com/installation/repositories?per_page=100&page=1'
      - id: SC-race-304-own-body
        level: integration
        title: a 304 that lands after another installation's 200 returns the requester's own repos
        given: both listings are cached, and ryabinski-labs' conditional request is held in flight
        when: cigan1's fresh 200 lands first, then ryabinski-labs receives 304 for the ETag it sent
        then: fetchOwnerRepos("ryabinski-labs") returns the ryabinski-labs repos, not an empty list
        oracle: 'result.map(r => r.fullName) deep-equals ["ryabinski-labs/Sendant", "ryabinski-labs/bev"]'
        status: green
        test_ref: "test/etag-installation-scope.test.js::SC-race-304-own-body: a 304 that lands after another installation's 200 returns the requester's own repos"
        doubles: 'globalThis.fetch stubbed with a deferred ryabinski-labs response; GitHub 304 semantics honoured per token'
      - id: SC-pat-key
        level: integration
        priority: P1
        title: PAT mode keys entries with pat
        given: PAT auth (GITHUB_TOKEN set, no App credentials)
        when: a GET is fetched through the scan and cached
        then: the cache key is the URL prefixed with pat and a space
        oracle: 'every key in etagCache starts with "pat https://api.github.com/"'
        status: green
        test_ref: "test/etag-installation-scope-pat.test.js::SC-pat-key: PAT mode keys entries with pat"
        doubles: 'globalThis.fetch stubbed; server started on an ephemeral port'

  - id: REQ-304-etag-match
    text: >-
      A 304 returns the cached body only when the stored ETag equals the If-None-Match value the
      request sent; on a mismatch the request is repeated once without If-None-Match and the 200
      is stored and returned.
    priority: P0
    type: functional
    prd_ref: 'section 5 story 2; DL-003'
    scenarios:
      - id: SC-304-match-no-extra
        level: integration
        title: a matching 304 returns the cached body with no extra request
        given: an installation's listing is cached with ETag E1
        when: the listing is fetched again and GitHub answers 304 to If-None-Match E1
        then: the cached repos are returned and exactly one listing request was made for the refetch
        oracle: 'listing request count for the second fetch === 1 and result equals the first result'
        status: green
        test_ref: "test/etag-installation-scope.test.js::SC-304-match-no-extra: a matching 304 returns the cached body with no extra request"
        doubles: 'globalThis.fetch stubbed'
        tags: [nfr]
      - id: SC-304-mismatch-refetches
        level: integration
        title: a 304 whose ETag no longer matches the slot triggers one unconditional refetch
        given: two concurrent requests from one installation both send E1, the first gets a 200 with E2, the second gets 304
        when: the second response is handled
        then: a third request goes out without If-None-Match, its 200 body is returned, and the slot holds its ETag
        oracle: 'third request has no if-none-match header; second caller result equals the third body; stored etag === E3'
        status: green
        test_ref: "test/etag-installation-scope.test.js::SC-304-mismatch-refetches: a 304 whose ETag no longer matches the slot triggers one unconditional refetch"
        doubles: 'globalThis.fetch stubbed with ordered deferred responses'
      - id: SC-304-retry-fails-falls-back
        level: integration
        negative: true
        title: a failed unconditional retry surfaces as a listing failure and keeps the last-known list
        given: ryabinski-labs' listing was loaded once, and a later 304 mismatches its slot
        when: the unconditional retry returns 502
        then: fetchOwnerRepos returns the last-known list and logs the listing failure with the last-known note
        oracle: 'result equals the last-known repos and console.error saw "listing ryabinski-labs repositories failed" with "(using last known list)"'
        status: green
        test_ref: "test/etag-installation-scope.test.js::SC-304-retry-fails-falls-back: a failed unconditional retry surfaces as a listing failure and keeps the last-known list"
        doubles: 'globalThis.fetch stubbed; console.error captured'

  - id: REQ-cache-file-v2
    text: >-
      The persisted cache file is written as version 2; a version 1 file is ignored on load, so the
      shared pre-fix entry cannot return after a restart.
    priority: P1
    type: functional
    prd_ref: 'section 5 story 3; A-001'
    scenarios:
      - id: SC-v1-file-discarded
        level: unit
        title: a version 1 cache file loads no entries
        given: an etag-cache.json with version 1 and one /installation/repositories entry
        when: loadEtagCacheFromDisk reads it
        then: no entries are restored
        oracle: 'loadEtagCacheFromDisk(file) === 0 and etagCache.size === 0'
        status: green
        test_ref: "test/etag-installation-scope-pat.test.js::SC-v1-file-discarded: a version 1 cache file loads no entries"
        doubles: 'none - temp file on disk'
      - id: SC-v2-roundtrip
        level: unit
        title: a version 2 file round-trips installation-prefixed keys
        given: a store with key "ryabinski-labs https://api.github.com/installation/repositories?per_page=100&page=1"
        when: it is saved and loaded again
        then: the file says version 2 and the same key is restored
        oracle: 'JSON.parse(file).version === 2 and etagCache.has(key)'
        status: green
        test_ref: "test/etag-installation-scope-pat.test.js::SC-v2-roundtrip: a version 2 file round-trips installation-prefixed keys"
        doubles: 'none - temp file on disk'

  - id: REQ-running-cd-visible
    text: >-
      A running CD workflow in a selected account's repo appears in /api/status cd.running on every
      scan while another installation's listing refresh races it.
    priority: P0
    type: functional
    prd_ref: 'section 2 job-to-be-done; section 4 goal 2'
    scenarios:
      - id: SC-running-cd-survives-race
        level: acceptance
        title: Sendant's running iOS CD stays on the dashboard through the listing race
        given: owners cigan1 and ryabinski-labs selected, ryabinski-labs/Sendant has an in-progress "iOS CD" run and no open PR, and a first scan has cached both listings
        when: a second scan runs where cigan1's listing 200 lands while ryabinski-labs' 304 is in flight
        then: the second /api/status response lists the Sendant run under cd.running
        oracle: 'status.cd.running.some(r => r.repo === "ryabinski-labs/Sendant") and status.summary.runningCd === 1'
        status: green
        test_ref: "test/etag-installation-scope.test.js::SC-running-cd-survives-race: Sendant's running iOS CD stays on the dashboard through the listing race"
        doubles: 'GitHub stubbed via globalThis.fetch; the real HTTP server handles /api/status'
